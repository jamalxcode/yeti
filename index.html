<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Yeti</title>
  <meta name="description" content="An arcade platformer: a penguin climbs an icy mountain to rescue a chick from a snowball-throwing yeti.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="wrap">
    <canvas id="screen" width="224" height="256" aria-label="Game screen"></canvas>
  </main>
  <div id="touch" aria-hidden="true">
    <div id="dpad"><div id="dpad-knob"></div></div>
    <div id="side-buttons">
      <button id="btn-pause" type="button">II</button>
      <button id="btn-mute" type="button">&#9835;</button>
    </div>
    <div id="btn-jump">JUMP</div>
  </div>
  <script type="module" src="js/main.js"></script>
<!-- GoatCounter analytics (not loaded on localhost; paths are prefixed with the host so all *.sala.company apps share one dashboard) -->
<script>
  (function () {
    if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
    window.goatcounter = { endpoint: 'https://salacompany.goatcounter.com/count', path: function (p) { return location.host + p; } };
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://salacompany.goatcounter.com/count');
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
