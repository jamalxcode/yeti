<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Yeti</title>
  <meta name="description" content="An arcade platformer: a penguin climbs an icy mountain to rescue a chick from a snowball-throwing yeti.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="wrap">
    <canvas id="screen" width="224" height="256" aria-label="Game screen"></canvas>
  </main>
  <div id="touch" aria-hidden="true">
    <div id="dpad"><div id="dpad-knob"></div></div>
    <div id="side-buttons">
      <button id="btn-pause" type="button">II</button>
      <button id="btn-mute" type="button">&#9835;</button>
    </div>
    <div id="btn-jump">JUMP</div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
